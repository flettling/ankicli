[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ankicli"
version = "0.1.0"
description = "A command line interface for Anki collections and AnkiWeb sync."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [{ name = "ankicli contributors" }]
dependencies = [
  "anki>=25.9,<26",
  "typer>=0.12",
  "rich>=13",
]

[project.scripts]
ankicli = "ankicli.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
